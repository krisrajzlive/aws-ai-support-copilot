[project]
name = "aws-ai-support-copilot"
version = "0.1.0"
description = "Multilingual support-case pipeline orchestrating Amazon Bedrock, Textract, Rekognition, Comprehend, Lex, SageMaker and more."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
copilot = "copilot.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
